version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: melodyhub_app
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      - postgres
      - redis
    networks:
      - melodyhub

  nginx:
    image: nginx:alpine
    container_name: melodyhub_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - melodyhub

  postgres:
    image: postgres:17
    container_name: melodyhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: melodyhub
      POSTGRES_USER: melodyhub
      POSTGRES_PASSWORD: melodyhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - melodyhub

  redis:
    image: redis:7-alpine
    container_name: melodyhub_redis
    ports:
      - "6379:6379"
    networks:
      - melodyhub

volumes:
  postgres_data:

networks:
  melodyhub:
